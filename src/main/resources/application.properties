spring.application.name=product-funder-matching

# The products and funders live in their own file, so they can change without touching code.
spring.config.import=classpath:catalogue.yml

# ---- Operations ----

# On shutdown, finish the requests already in progress (up to 20 seconds) before stopping.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Drop connections that stay silent for 10 seconds.
server.tomcat.connection-timeout=10s

# Only the health endpoint is exposed; nothing that reveals configuration or internals.
management.endpoints.web.exposure.include=health
# Separate liveness and readiness checks (/actuator/health/liveness and /readiness) for a platform
# that restarts or routes around an unhealthy instance.
management.endpoint.health.probes.enabled=true

# Every log line carries the request id, so one request can be followed through the logs.
logging.pattern.level=%5p [%X{requestId:-}]
